name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Called by deploy.yml, so a release runs the same checks first.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coding-standards:
    name: Coding standards (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor declared by the plugin, and the floor WordPress core
        # itself declares. The upper bound tracks the versions core supports.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      - name: Lint PHP files
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Run PHP_CodeSniffer
        run: composer lint

  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foldmark_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASS: root

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer, wp-cli
          extensions: mysqli

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      # The test suite loads WordPress from WP_CORE_DIR. The latest release is
      # what the plugin declares it is tested up to.
      - name: Download WordPress
        run: wp core download --path="${WP_CORE_DIR}" --version=latest

      - name: Run PHPUnit
        run: composer test

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plugin Check must run on what is actually published, not on the source
      # tree. Development files that .distignore removes from the package would
      # otherwise be reported as errors, and the plugin slug has to match the
      # directory name or every text domain check misfires.
      - name: Build the publishable package
        run: |
          mkdir -p build/foldmark
          rsync -a --delete --delete-excluded \
            --exclude-from=.distignore \
            ./ build/foldmark/
          echo 'Package contents:'
          find build/foldmark -type f | sort

      - name: Run the official Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          build-dir: './build/foldmark'
          categories: |
            general
            plugin_repo
            security
            performance
            accessibility
